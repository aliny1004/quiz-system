<!--
PQS 線上版考試頁。
由 home.html 選取題庫後進入，負責測驗渲染、作答、計時、題目面板與結算。
共用樣式：css/app.css；共用程式：js/app.js；環境設定：env.js。
離線單檔版本：PQS_offline.html，由 scripts/build-offline.js 產生。
-->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>????PQS</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body data-page="quiz">
<div class="exam-header" translate="no">
    <div class="header-main">
        <button type="button" class="mobile-header-panel-toggle" id="mobileHeaderPanelToggle" onclick="toggleMobileExamPanel()" aria-label="展開或收合題目面板" aria-expanded="false">☰</button>
        <button type="button" class="app-title-button" onclick="returnHomeFromHeader()">
            <span class="app-title-text" id="appTitleText">練習測驗系統</span>
        </button>
    </div>

    <div class="header-tools">
        <!-- 明暗模式滑動切換器：太陽為正常模式，月亮為深色模式 -->
        <label class="theme-switch" title="切換正常/深色模式">
            <span class="theme-icon" aria-hidden="true">☀</span>
            <input type="checkbox" id="themeModeCheckbox" aria-label="切換深色模式">
            <span class="theme-slider"></span>
            <span class="theme-icon" aria-hidden="true">☾</span>
        </label>

        <!-- 動態計時器 -->
        <div class="proctor-status" id="examTimer" style="font-family: monospace; font-size: 15px; letter-spacing: 1px;">作答時間 00:00:00</div>

        <div class="user-menu-shell" id="userMenuShell">
            <button type="button" class="user-menu-button" id="userMenuButton" onclick="toggleUserMenu()" aria-haspopup="menu" aria-expanded="false" aria-label="使用者選單">
                <span class="user-avatar" id="userAvatar">--</span>
                <span class="user-display-name" id="userDisplayName"></span>
            </button>
            <div class="user-menu" id="userMenu" role="menu" hidden>
                <div class="user-menu-row" role="presentation">
                    <svg class="user-menu-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8" />
                        <path d="M5.8 19c.9-3.4 3-5.1 6.2-5.1s5.3 1.7 6.2 5.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.55" />
                    </svg>
                    <span class="user-menu-name" id="userMenuName"></span>
                </div>
                <button type="button" class="user-menu-row user-menu-action" role="menuitem" onclick="switchPqsUser()">
                    <svg class="user-menu-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M9 7V5h9v14H9v-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M4 12h9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                        <path d="M10 9l3 3-3 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    <span>切換使用者</span>
                </button>
            </div>
        </div>
    </div>
</div>

<canvas id="homeMatrixCanvas" class="home-matrix-canvas" aria-hidden="true"></canvas>
<div id="themeTransitionOverlay" class="theme-transition-overlay" aria-hidden="true"></div>

<div id="quizSection" style="display: flex; flex-direction: column;">
    
    <div class="quiz-active-layout">
        
        <div class="exam-left-panel">
            <div id="summaryBox" class="summary" translate="no">
                <h1> 測驗結果 </h1>
                <p class="summary-text" id="statsText"></p>
                <div class="summary-actions">
                    <button class="action-btn summary-stats-btn" translate="no" onclick="toggleStatsPanel(true)">查看統計</button>
                    <div class="summary-retry-row">
                        <label class="wrong-retry-toggle" title="勾選後，再次測驗只會考本次錯題">
                            <input type="checkbox" id="wrongRetryPreferenceCheckbox">
                            <span>僅錯題</span>
                        </label>
                        <button class="action-btn summary-retry-btn" translate="no" onclick="startSummaryRetry()">再次測驗</button>
                    </div>
                </div>
            </div>

            <div id="quizContainer"></div>
        </div>

        <div class="mobile-panel-backdrop" id="mobilePanelBackdrop" onclick="closeMobileExamPanel()" aria-hidden="true"></div>

        <div class="exam-right-panel" id="examRightPanel" translate="no">
            <button type="button" class="mobile-exam-panel-toggle" id="mobileExamPanelToggle" onclick="toggleMobileExamPanel()" aria-label="展開或收合題目面板" aria-expanded="false">題目</button>

            <div class="info-card" style="flex: 1; display: flex; flex-direction: column;">
                <h4>題目面板 (Item Review)</h4>
                <div class="nav-grid" id="examNavGrid"></div>
                <div class="nav-legend">
                    <h4>作答狀態（底色）：</h4>
                    <div>■ 白色：未作答 (Unanswered)</div>
                    <div><span style="color: #3498db;">■</span> 藍色：已作答 (Answered)</div>
                    <div><span style="color: #f39c12;">■</span> 橘色：已標記 (Marked)</div>
                    
                    <h4 style="margin-top: 12px; margin-bottom: 4px;">結算狀態（外框）：</h4>
                    <div><span style="color: #2ecc71; font-weight: bold;">▢</span> 綠色外框：此題答對 (Correct)</div>
                    <div><span style="color: #e74c3c; font-weight: bold;">▢</span> 紅色外框：此題答錯 (Wrong)</div>
                </div>
            </div>
        </div>
    </div>

    <div class="exam-footer" translate="no">
        <div class="footer-hint-text"><span class="footer-hint-segment">請檢查所有題目面板狀態後，</span><span class="footer-hint-segment">點擊右側按鈕送出。</span></div>
        <div>
            <button id="submitBtn" class="submit-btn" onclick="checkAnswers()">完成作答 (Submit Exam)</button>
        </div>
    </div>

</div>

<script src="env.js"></script>
<script src="js/app.js"></script>
</body>
</html>
